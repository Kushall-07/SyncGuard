# SyncGuard - Phase 4: CNN audio spoof-detection baseline.
#
# Trains src.models.audio.SpoofClassifier on an audio manifest (synthetic now,
# real ASVspoof 2019 LA once downloaded). Values are starting points, not tuned
# optima - Phase 6 establishes the real numbers and Phase 5 compares a
# Transformer variant against this baseline.

experiment:
  name: spoof-cnn-baseline
  seed: 1337
  deterministic: false
  output_root: outputs/runs

audio: configs/audio.yaml
data: configs/asvspoof.yaml

model:
  audio_embedding_dim: 256        # temporal-token dim emitted by the CNN encoder
  audio_cnn_channels: [32, 64, 128]
  audio_cnn_dropout: 0.1
  spoof_head_hidden: 128
  spoof_head_pooling: attentive   # attentive | mean | meanmax
  dropout: 0.1
  num_heads: 4                    # unused here; kept for cross-phase config compatibility

augment:
  enabled: true
  noise_prob: 0.5
  noise_snr_db: [10.0, 30.0]
  gain_prob: 0.5
  gain_db: [-6.0, 6.0]
  specaugment:
    freq_masks: 2
    freq_mask_width: 12
    time_masks: 2
    time_mask_width: 16

training:
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  epochs: 30
  num_workers: 2
  amp: true
  grad_accum_steps: 1
  grad_clip_norm: 5.0
  monitor: val_eer               # anti-spoofing headline metric (lower is better)
  monitor_mode: min
  early_stopping_patience: 6
