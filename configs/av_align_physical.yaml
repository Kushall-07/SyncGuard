# SyncGuard - Physical-Shift Synchronization Training (sync-detection fix)
#
# Corrects the Phase 11/12 training/inference mismatch documented in
# docs/decisions/0006-physical-sync-training.md: negatives are now built by
# physically shifting the raw audio WAVEFORM (src.data.audio_shift.shift_waveform)
# BEFORE the mel spectrogram / audio encoder, using the same consecutive
# 32-frame/stride-32 production windowing (src.inference.windowing) the deployed
# predictor uses - not by re-bucketing already-encoded audio tokens onto a
# shifted time grid (the original Phase 11 src.data.sync_pairs mechanism, left
# unmodified for old-vs-new comparison via configs/av_align_lambda01.yaml).
#
# Frozen encoders (UNCHANGED from Phase 11/12, never modified/retrained here):
#   - Phase-5 shared CNN+Transformer AudioEncoder
#   - Phase-8 visual Transformer VisualEncoder
# Trainable (same architecture as Phase 10/11, only re-trained on corrected data):
#   - BidirectionalCrossAttention
#   - SyncHead
# No contrastive loss - BCE-only, per "use the existing SyncHead BCE objective
# unless there is a demonstrated reason to change it".

audio:
  sample_rate: 16000
  mono: true
  normalize: peak
  norm_target: 1.0
  mel:
    n_fft: 400
    hop_length: 160
    win_length: 400
    n_mels: 80
    f_min: 0.0
    f_max: 8000.0
    power: 2.0
    center: true
    log: true
    log_top_db: 80.0

experiment:
  name: sync-physical
  seed: 42
  deterministic: false
  output_root: outputs/runs

training:
  batch_size: 24
  learning_rate: 0.0003
  weight_decay: 0.0001
  # First pass (epochs=12, warmup=1, patience=4): val_video_sync_auc plateaued
  # at 0.581 (epoch 8), well above chance (0.5) but modest. Longer schedule +
  # more per-clip window coverage for the follow-up run (see run history in
  # docs/decisions/0006-physical-sync-training.md / final report).
  epochs: 30
  num_workers: 2
  amp: true
  grad_accum_steps: 1
  grad_clip_norm: 5.0
  monitor: val_video_sync_auc
  monitor_mode: max
  early_stopping_patience: 8
  scheduler: cosine
  warmup_epochs: 2
  # Read directly from av_align.physical_sync_pairs by the training script
  # (TrainingConfig has no physical-shift-specific fields; see
  # PhysicalSyncPairConfig in src/data/lavdf_physical_sync_dataset.py).
  negative_pair_probability: 0.5

av_align:
  audio_encoder_pt: outputs/runs/spoof-transformer-20260906-123646/checkpoints/audio_encoder.pt
  visual_encoder_pt: outputs/runs/deepfake-transformer-final-20260908-210034/checkpoints/visual_encoder.pt
  audio_variant_required: cnn_transformer

  video:
    num_frames: 32                     # matches production window_frames
    regions: face_mouth

  cross_attention:
    dim: 256
    num_heads: 4
    n_layers: 1
    ff_dim: 1024
    dropout: 0.1
    fusion: concat_proj
    add_positional_encoding: false

  sync_head:
    hidden_dim: 128
    dropout: 0.1
    aggregation: mean

  sync_loss:
    pos_weight: null                   # dataset already balances pos/neg via negative_pair_probability
    reduction: mean

  # Physical-shift + cross-clip negative construction
  # (src.data.lavdf_physical_sync_dataset.PhysicalSyncPairConfig).
  physical_sync_pairs:
    shift_magnitudes_seconds: [0.25, 0.5, 0.75, 1.0]
    negative_pair_probability: 0.5
    cross_clip_probability: 0.2        # 20% of negatives are cross-clip; 80% physical-shift
    window_frames: 32
    stride_frames: 32
