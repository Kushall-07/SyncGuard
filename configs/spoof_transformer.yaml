# SyncGuard - Phase 5: CNN + Transformer audio spoof-detection model.
#
# Identical to configs/spoof_cnn.yaml except model.audio_encoder, so a run with
# this config is directly comparable to the Phase 4 CNN baseline on the same
# manifest / split / seed. Values are starting points, not tuned optima.

experiment:
  name: spoof-transformer
  seed: 1337
  deterministic: false
  output_root: outputs/runs

audio: configs/audio.yaml
data: configs/asvspoof.yaml

model:
  audio_embedding_dim: 256
  audio_cnn_channels: [32, 64, 128]
  audio_cnn_dropout: 0.1
  audio_encoder: cnn_transformer   # <-- the only change vs spoof_cnn.yaml
  audio_tf_layers: 3
  audio_tf_ff_dim: 1024
  audio_tf_dropout: 0.1
  num_heads: 4                     # Transformer attention heads (divides audio_embedding_dim)
  spoof_head_hidden: 128
  spoof_head_pooling: attentive
  dropout: 0.1

augment:
  enabled: true
  noise_prob: 0.5
  noise_snr_db: [10.0, 30.0]
  gain_prob: 0.5
  gain_db: [-6.0, 6.0]
  specaugment:
    freq_masks: 2
    freq_mask_width: 12
    time_masks: 2
    time_mask_width: 16

training:
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 30
  num_workers: 2
  amp: true
  grad_accum_steps: 1
  grad_clip_norm: 5.0
  monitor: val_eer
  monitor_mode: min
  early_stopping_patience: 6
