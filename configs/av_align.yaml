# SyncGuard - Phases 9-10: Audio-Visual Temporal Alignment + Bidirectional
# Cross-Attention.
#
# Phase 9 (av_align.alignment / av_align.video): wires the frozen Phase-5 shared
# audio encoder (CNN+Transformer *representation* encoder - NOT the score-level
# ensemble) and the frozen Phase-8 visual Transformer encoder through the
# deterministic time-aware temporal-correspondence aligner
# (src/models/fusion/temporal_align.py).
#
# Phase 10 (av_align.cross_attention): bidirectional audio<->visual cross-attention
# over the aligned tokens (src/models/fusion/cross_attention.py). No sync head, no
# sync loss - those are Phases 11/12.
#
# Phase 11 (av_align.sync_head / av_align.sync_loss / av_align.sync_pairs):
# audio-visual synchronization training with positive/negative temporal shifts.
#
# NOTE (data limitation): Celeb-DF-v2 mp4s are video-only, so this pipeline cannot
# yet be exercised on real paired audio+video. See
# docs/decisions/0003-av-temporal-alignment.md and 0004-av-cross-attention.md.

# Audio preprocessing configuration (for LAV-DF dataset)
audio:
  sample_rate: 16000
  mono: true
  normalize: peak
  norm_target: 1.0
  mel:
    n_fft: 400
    hop_length: 160
    win_length: 400
    n_mels: 80
    f_min: 0.0
    f_max: 8000.0
    power: 2.0
    center: true
    log: true
    log_top_db: 80.0

# Experiment configuration
experiment:
  name: sync-phase11
  seed: 42
  deterministic: false
  output_root: outputs/runs

# Training configuration
training:
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 120
  num_workers: 2
  amp: true
  grad_accum_steps: 1
  grad_clip_norm: 5.0
  monitor: val_video_sync_auc
  monitor_mode: max
  early_stopping_patience: 0
  scheduler: cosine
  warmup_epochs: 8
  negative_pair_probability: 0.5  # probability of using negative pairs during training
  lambda_contrastive: 0.0         # weight for contrastive loss (0 = sync-only, >0 = combined)

av_align:
  # Exported encoder checkpoints. Paths are placeholders - point them at concrete
  # exports before use.
  #   audio: a Phase-5 spoof-transformer run's checkpoints/audio_encoder.pt
  #          (payload variant MUST be "cnn_transformer")
  #   video: a Phase-8 train_deepfake_landmark.py --export-encoder run's
  #          checkpoints/visual_encoder.pt
  audio_encoder_pt: outputs/runs/spoof-transformer-20260906-123646/checkpoints/audio_encoder.pt
  visual_encoder_pt: outputs/runs/deepfake-transformer-final-EXPORT/checkpoints/visual_encoder.pt
  audio_variant_required: cnn_transformer

  alignment:
    policy: time_aware_correspondence   # interval-overlap mean; NOT adaptive_avg_pool1d / interpolation
    target_grid: video_rate            # one bucket per video frame: [k/fps, (k+1)/fps)
    empty_bucket: nearest              # nearest (nearest audio token by interval centre) | zero
    window_seconds: per_clip_fps       # per_clip_fps -> n_video_tokens / fps ; or a positive float

  video:
    num_frames: 32                     # T_v, the dense contiguous window
    regions: face_mouth

  # Phase 10 - bidirectional cross-attention over the aligned tokens.
  cross_attention:
    dim: 256                           # both modalities are 256-D; no projection layers
    num_heads: 4
    n_layers: 1                        # 1 per direction by default; 2 is a cheap ablation
    ff_dim: 1024                       # FFN 256 -> 1024 -> 256, GELU
    dropout: 0.1
    fusion: concat_proj               # production default | gated | add (ablations only)
    add_positional_encoding: false     # inputs already carry the encoders' positional info

  # Phase 11 - sync head for audio-visual synchronization
  sync_head:
    hidden_dim: 128                    # hidden dimension for sync head
    dropout: 0.1                       # dropout rate
    aggregation: mean                   # video-level aggregation: mean | max | median

  # Phase 11 - sync loss configuration
  sync_loss:
    pos_weight: null                    # positive class weight (null = balanced)
    reduction: mean                    # loss reduction: none | mean | sum

  # Phase 11 - temporal target and pair construction
  sync_pairs:
    shift_seconds: [-2.0, -1.0, -0.5, 0.5, 1.0, 2.0]  # audio shift values in seconds
    shift_strategy: uniform            # shift sampling: uniform | random
    audio_token_seconds: 0.01         # from Phase 5 audio encoder (hop_length / sr = 160/16000)

  # Phase 12 - contrastive learning (InfoNCE)
  contrastive:
    enabled: false                   # enable/disable contrastive learning
    projection_dim: 128              # output projection dimension
    hidden_dim: 256                  # hidden layer dimension for projection heads
    adapter_hidden_dim: 256          # hidden layer dimension for adapters
    dropout: 0.1                      # dropout rate
    use_bn: true                     # use batch normalization
    temperature: 0.07                # InfoNCE temperature
    reduction: mean                  # loss reduction: none | mean | sum
    symmetric: true                  # use symmetric InfoNCE (audio->visual + visual->audio)
