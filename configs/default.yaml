# SyncGuard - default experiment configuration (Phase 2B infra spine).
#
# This is the template every later phase copies and overrides. Values are
# STARTING points from the project spec (master-doc section 20 / 21), not tuned
# optima - experiments in later phases establish the real numbers.

experiment:
  name: syncguard-default
  seed: 1337
  deterministic: false          # true -> torch deterministic algorithms (slower)
  output_root: outputs/runs     # per-run directories are created under here

# The audio front-end is shared by the spoof detector and the AV sync branch,
# so it lives in its own file and is referenced here by path.
audio: configs/audio.yaml

model:
  audio_embedding_dim: 256
  visual_embedding_dim: 256
  num_heads: 4
  dropout: 0.1

training:
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0
  epochs: 20
  num_workers: 2
  amp: true                     # mixed precision - fits the 6 GB laptop GPU (spec 21)
  grad_accum_steps: 1           # raise to simulate a larger batch on limited VRAM
  grad_clip_norm: 5.0           # 0 disables gradient clipping
  monitor: val_loss             # metric watched for best checkpoint + early stopping
  monitor_mode: min             # min | max
  early_stopping_patience: 5    # 0 disables early stopping
